name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Serialize main releases so an older build cannot publish after a newer one.
# Superseded PR checks can be cancelled without interrupting a main deployment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      # Download the test MongoDB binary once. Otherwise each test file downloads it
      # at the same time and they race on the same cache file (ENOENT on rename).
      - name: Download MongoDB test binary
        working-directory: server
        run: node -e "require('mongodb-memory-server').MongoBinary.getPath().then((p) => console.log('MongoDB binary ready:', p))"

      - name: Run server tests
        run: npm run test --prefix server

      - name: Run client unit tests
        run: npm run test --prefix client

      - name: Run full-stack integration tests
        run: npm run test:integration --prefix client

      - name: Build client production bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://rec-center-radar-api.onrender.com' }}
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build --prefix client

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
